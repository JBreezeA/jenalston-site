title: Jennifer Alston
description: SEO, GEO and AEO strategy. Discoverable by Design.
url: "https://jenalston.com"
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-feed
feed:
  path: feed.xml
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/
exclude:
  - README.md
  - README.txt
