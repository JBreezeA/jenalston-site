# Pages CMS settings for jenalston.com (https://app.pagescms.org)
# Upload this file to the main folder of the jenalston-site repo.

media:
  input: images
  output: /images

content:
  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title (H1 and SEO title)
        type: string
        required: true
        description: "Aim for about 50-60 characters."
      - name: description
        label: Meta description
        type: text
        required: true
        description: "Shown in Google results and social shares. Aim for 140-160 characters."
      - name: date
        label: Publish date
        type: string
        required: true
        description: "Format: 2026-10-24 09:00:00 -0400"
      - name: last_modified_at
        label: Last updated
        type: string
        description: "Update this when you make a meaningful edit. Same format as the publish date."
      - name: image
        label: Header image
        type: image
        description: "Optional. Wide images (1200 x 630 or larger) work best."
      - name: image_alt
        label: Header image alt text
        type: string
        description: "Describe what the image shows, for screen readers and search engines."
      - name: takeaways
        label: Key takeaways
        type: string
        list: true
        description: "3 to 5 short points. They show in a dark box after your intro, above the table of contents (which builds itself from your H2 headings). Use **double asterisks** for bold."
      - name: faq
        label: FAQ (adds FAQ schema)
        type: object
        list: true
        fields:
          - name: q
            label: Question
            type: string
          - name: a
            label: Answer
            type: text
      - name: body
        label: Post content
        type: rich-text
        description: "Start with 1-2 intro paragraphs, then use Heading 2 for each section. Quick answer box: add a quote block, make the first line the question in bold, then the answer on the next line. Image caption: put a line of italic text right under the image. The FAQ appears before a section titled Summary, or at the end."
        options:
          format: markdown
          switcher: true
          extensions: [webp, jpg, jpeg, png, gif, svg]
          rename: safe

  # ---------- Site pages ----------
  - name: page-home
    label: "Page: Home"
    type: file
    path: index.html
    format: yaml-frontmatter
    fields:
      - name: title
        label: SEO title
        type: string
        required: true
        description: "Shows in the browser tab and as the blue headline in Google. Aim for 50-60 characters."
      - name: description
        label: Meta description
        type: text
        required: true
        description: "The snippet under your title in Google. Aim for 140-160 characters."
      - name: canonical
        label: Page address
        type: string
        readonly: true
        description: "Set automatically. Don't change this."
      - name: social_title
        label: Social share title (optional)
        type: string
        description: "Title on LinkedIn, Facebook and X previews. Leave blank to use the SEO title."
      - name: social_description
        label: Social share description (optional)
        type: text
        description: "Leave blank to use the meta description."
      - name: social_image
        label: Social share image (optional)
        type: image
        description: "1200 x 630 works best. Leave blank to use your main jenalston.com share image."
      - name: social_image_alt
        label: Social share image alt text (optional)
        type: string
        description: "Describe the share image. Leave blank to use the default description."
      - name: body
        label: Page content (HTML)
        type: code
        options:
          format: html
